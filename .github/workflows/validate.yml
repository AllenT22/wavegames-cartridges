name: Validate cartridge distribution
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tools/wavegame/tests/*.test.mjs
      - run: node tools/wavegame/bin/build-first-party.mjs artifacts/verified-release
      - run: diff -r releases/1.1.0 artifacts/verified-release
      - run: cd releases/1.1.0 && sha256sum -c SHA256SUMS-ALL.txt
      - run: node scripts/check-distribution.mjs
