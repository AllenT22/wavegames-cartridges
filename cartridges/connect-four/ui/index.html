<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Connect Four</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <p id="seat" class="eyebrow">Connecting…</p>
          <h1>Connect Four</h1>
        </div>
        <div id="turn" class="turn" aria-live="polite">Waiting for host</div>
      </header>
      <p id="message" class="message" aria-live="polite">Waiting for the match…</p>
      <section class="playfield" aria-label="Connect Four">
        <div id="columns" class="columns" role="group" aria-label="Choose a column"></div>
        <div id="board" class="board" role="group" aria-label="Board: rows are counted from the top"></div>
      </section>
      <section class="actions" aria-label="Match actions">
        <button id="surrender" class="action" type="button" disabled>Surrender</button>
        <button id="rematch" class="action primary" type="button" hidden>Request rematch</button>
      </section>
      <footer><span id="my-disc">Red discs: 1 · Yellow discs: 2</span></footer>
    </main>
    <script type="module" src="game.mjs"></script>
  </body>
</html>
