<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Connect Four</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <p id="seat" class="eyebrow">Connecting…</p>
          <h1>Connect Four</h1>
        </div>
        <div id="turn" class="turn">Waiting for host</div>
      </header>
      <p id="message" class="message" aria-live="polite"></p>
      <section id="board" class="board" aria-label="Connect Four board"></section>
      <section class="actions">
        <button id="surrender" class="action" type="button">Surrender</button>
        <button id="rematch" class="action primary" type="button" hidden>Request rematch</button>
      </section>
      <footer>
        <span><i class="disc red"></i> Player 1</span>
        <span><i class="disc yellow"></i> Player 2</span>
      </footer>
    </main>
    <script type="module" src="game.mjs"></script>
  </body>
</html>
