name: wavegame_runtime
description: Native import and sandboxed WebView runtime for WaveGames cartridges.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.wavegames.wavegame_runtime
        pluginClass: WavegameRuntimePlugin
      ios:
        pluginClass: WavegameRuntimePlugin
